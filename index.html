<!DOCTYPE html>  <html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">  
<meta name="theme-color" content="#080b14">  
<title>NEXORA AI</title>  
<link rel="manifest" href="/manifest.json">  
<style>  
:root{--bg:#080b14;--panel:#101827;--panel2:#17243a;--line:#26364d;--cyan:#55dfff;--blue:#168bff;--muted:#9ba9bd;--text:#f5f8ff}  
*{box-sizing:border-box;margin:0;padding:0}  
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}  
button,input,textarea{font:inherit}  
button{cursor:pointer}  
.hidden{display:none!important}  
#authView{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}  
.auth-card{width:min(100%,420px);padding:30px 24px;background:linear-gradient(160deg,#121e31,#0d1421);border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 60px #0008}  
.brand{text-align:center;color:var(--cyan);font-size:28px;font-weight:800;letter-spacing:5px;text-shadow:0 0 18px #168bff;margin-bottom:10px}  
.auth-sub{text-align:center;color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:26px}  
.auth-card h2{text-align:center;font-size:21px;margin-bottom:18px}  
.auth-card input{width:100%;padding:14px 15px;margin:7px 0;background:#080e1b;border:1px solid #34516d;border-radius:11px;color:white;outline:none}  
.auth-card input:focus,.composer textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 2px #55dfff22}  
.primary,.secondary{width:100%;padding:14px;border-radius:11px;margin-top:12px;font-weight:700}  
.primary{border:0;background:var(--blue);color:white}  
.secondary{border:1px solid #34516d;background:transparent;color:var(--cyan)}  
.switch-text{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}  
.switch-text button{border:0;background:none;color:var(--cyan);font-weight:700}  
#authMessage{font-size:13px;line-height:1.5;color:var(--cyan);margin-top:12px;text-align:center;min-height:18px}  
#appView{height:100%;display:flex;overflow:hidden}  
.sidebar{width:280px;flex:0 0 280px;background:#0d1421;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px;gap:14px;transition:transform .22s ease}  
.side-brand{font-size:20px;letter-spacing:3px;font-weight:800;color:var(--cyan);padding:5px 4px}  
.new-chat{background:#17243a;border:1px solid #34516d;color:white;border-radius:12px;padding:13px;text-align:left}  
.new-chat:hover,.history-item:hover{background:#20314b}  
.history-title{font-size:11px;color:#8193ad;text-transform:uppercase;letter-spacing:1.5px;margin:8px 4px 0}  
#historyList{overflow:auto;display:flex;flex-direction:column;gap:5px}  
.history-item{border:0;background:transparent;color:#dce7f7;text-align:left;padding:11px;border-radius:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}  
.history-item.active{background:#17243a}  
.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}  
.account-email{font-size:12px;color:var(--muted);overflow-wrap:anywhere;margin:0 4px 10px}  
.logout{width:100%;border:1px solid #34516d;background:transparent;color:#dce7f7;padding:11px;border-radius:10px}  
.main-panel{min-width:0;flex:1;display:flex;flex-direction:column;height:100%;position:relative}  
.topbar{height:62px;flex:0 0 62px;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--line);background:#0b111d}  
.menu-btn{border:0;background:transparent;color:white;font-size:22px;padding:5px 8px}  
.top-title{font-weight:700;letter-spacing:1px}  
.online{margin-left:auto;color:#62f5b0;font-size:12px}  
#messages{flex:1;overflow-y:auto;width:100%;padding:30px 18px 24px;scroll-behavior:smooth}  
.welcome-chat{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px}  
.welcome-chat .orb{width:68px;height:68px;border:1px solid var(--cyan);border-radius:50%;display:grid;place-items:center;color:var(--cyan);font-size:30px;box-shadow:0 0 24px #168bff55;margin-bottom:20px}  
.welcome-chat h1{font-size:clamp(24px,4vw,34px);letter-spacing:2px;margin-bottom:10px}  
.welcome-chat p{color:var(--muted);font-size:14px;line-height:1.6}  
.message-row{width:min(100%,900px);margin:0 auto 22px;display:flex;gap:12px;align-items:flex-start}  
.message-row.user{justify-content:flex-end}  
.bubble{max-width:min(82%,760px);padding:14px 17px;border-radius:17px;line-height:1.65;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}  
.assistant .bubble{background:#111d2e;border:1px solid #263b58;border-top-left-radius:5px}  
.user .bubble{background:#1269bd;border:1px solid #2688e4;border-top-right-radius:5px}  
.avatar{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#06111e;background:var(--cyan)}  
.user .avatar{order:2;background:#398ee6;color:white}  
.composer-wrap{width:100%;padding:12px 18px max(16px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#080b14 18%)}  
.composer{width:min(100%,900px);margin:0 auto;background:#111827;border:1px solid #34516d;border-radius:20px;padding:12px 14px 10px;box-shadow:0 8px 30px #0005}  
.composer textarea{display:block;width:100%;min-height:54px;max-height:180px;resize:none;background:transparent;border:0;color:white;outline:none;padding:8px 4px;font-size:16px;line-height:1.5}  
.composer textarea::placeholder{color:#8da7c8}  
.composer-bottom{display:flex;align-items:center;justify-content:space-between}  
.composer-hint{font-size:11px;color:#71839c}  
.send-btn{width:40px;height:40px;border:0;border-radius:13px;background:var(--blue);color:white;font-size:21px}  
.send-btn:disabled{opacity:.45;cursor:not-allowed}  
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#17243a;border:1px solid #34516d;border-radius:12px;padding:12px 16px;color:white;font-size:13px;max-width:90%;z-index:20}  
@media(max-width:720px){  
 .sidebar{position:fixed;z-index:10;top:0;bottom:0;left:0;transform:translateX(-105%);box-shadow:20px 0 50px #0008}  
 .sidebar.open{transform:translateX(0)}  
 .topbar{padding:0 12px}  
 #messages{padding:20px 12px}  
 .composer-wrap{padding-left:10px;padding-right:10px}  
 .bubble{max-width:88%;font-size:14px}  
}  
@media(min-width:721px){.sidebar{transform:none!important}}  
</style>  
</head>  
<body>  
<section id="authView">  
  <div class="auth-card">  
    <div class="brand">NEXORA AI</div>  
    <p class="auth-sub">YOUR INTELLIGENCE. YOUR CONTROL. YOUR FUTURE.</p>  
    <div id="welcomePanel">  
      <h2>Welcome to NEXORA</h2>  
      <p class="auth-sub">Sign in or create an account to start chatting.</p>  
      <button class="primary" id="showLogin">LOGIN</button>  
      <button class="secondary" id="showSignup">CREATE ACCOUNT</button>  
    </div>  
    <form id="loginForm" class="hidden">  
      <h2>Login</h2>  
      <input id="loginEmail" type="email" placeholder="Email address" autocomplete="email" required>  
      <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" required>  
      <button class="primary" type="submit">LOGIN</button>  
      <p class="switch-text">New to NEXORA? <button type="button" id="loginToSignup">Create account</button></p>  
    </form>  
    <form id="signupForm" class="hidden">  
      <h2>Create Account</h2>  
      <input id="signupEmail" type="email" placeholder="Email address" autocomplete="email" required>  
      <input id="signupPassword" type="password" placeholder="Password (at least 6 characters)" minlength="6" autocomplete="new-password" required>  
      <button class="primary" type="submit">CREATE ACCOUNT</button>  
      <p class="switch-text">Already have an account? <button type="button" id="signupToLogin">Login</button></p>  
    </form>  
    <div id="authMessage" role="status"></div>  
  </div>  
</section>  <section id="appView" class="hidden">  
  <aside class="sidebar" id="sidebar">  
    <div class="side-brand">NEXORA AI</div>  
    <button class="new-chat" id="newChat">＋　New chat</button>  
    <div class="history-title">Recent chats</div>  
    <div id="historyList"></div>  
    <div class="side-bottom">  
      <div class="account-email" id="accountEmail"></div>  
      <button class="logout" id="logoutBtn">Log out</button>  
    </div>  
  </aside>  
  <main class="main-panel">  
    <header class="topbar">  
      <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>  
      <div class="top-title">NEXORA</div>  
      <div class="online">● SYSTEM ONLINE</div>  
    </header>  
    <div id="messages" aria-live="polite"></div>  
    <div class="composer-wrap">  
      <div class="composer">  
        <textarea id="userInput" rows="1" placeholder="Message NEXORA..." aria-label="Message NEXORA"></textarea>  
        <div class="composer-bottom">  
          <span class="composer-hint">Enter to send · Shift + Enter for a new line</span>  
          <button class="send-btn" id="sendBtn" aria-label="Send message">↑</button>  
        </div>  
      </div>  
    </div>  
  </main>  
</section>  
<div id="toast" class="hidden"></div>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <script>  
const SUPABASE_URL = "https://xvfavqnxvgolgrwgvfbq.supabase.co";  
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_nyEMPz7RX1ggqRRFo27UQQ_CvWy_U2w";  
const WORKER_URL = "https://nexora-brain2026.shinehtett118.workers.dev";  
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);  
  
const authView = document.getElementById("authView");  
const appView = document.getElementById("appView");  
const authMessage = document.getElementById("authMessage");  
const welcomePanel = document.getElementById("welcomePanel");  
const loginForm = document.getElementById("loginForm");  
const signupForm = document.getElementById("signupForm");  
const messages = document.getElementById("messages");  
const userInput = document.getElementById("userInput");  
const sendBtn = document.getElementById("sendBtn");  
const historyList = document.getElementById("historyList");  
const sidebar = document.getElementById("sidebar");  
let chats = [];  
let activeChatId = null;  
let sending = false;  
  
function showAuthPanel(panel) {  
  welcomePanel.classList.toggle("hidden", panel !== "welcome");  
  loginForm.classList.toggle("hidden", panel !== "login");  
  signupForm.classList.toggle("hidden", panel !== "signup");  
  authMessage.textContent = "";  
}  
document.getElementById("showLogin").addEventListener("click", () => showAuthPanel("login"));  
document.getElementById("showSignup").addEventListener("click", () => showAuthPanel("signup"));  
document.getElementById("loginToSignup").addEventListener("click", () => showAuthPanel("signup"));  
document.getElementById("signupToLogin").addEventListener("click", () => showAuthPanel("login"));  
  
signupForm.addEventListener("submit", async (event) => {  
  event.preventDefault();  
  authMessage.textContent = "Creating your account...";  
  const email = document.getElementById("signupEmail").value.trim();  
  const password = document.getElementById("signupPassword").value;  
  const { error } = await supabaseClient.auth.signUp({  
    email, password,  
    options: { emailRedirectTo: window.location.origin }  
  });  
  authMessage.textContent = error  
    ? error.message  
    : "Account created. Please check your email and confirm your account, then log in.";  
});  
  
loginForm.addEventListener("submit", async (event) => {  
  event.preventDefault();  
  authMessage.textContent = "Logging in...";  
  const email = document.getElementById("loginEmail").value.trim();  
  const password = document.getElementById("loginPassword").value;  
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });  
  if (error) authMessage.textContent = error.message;  
});  
  
document.getElementById("logoutBtn").addEventListener("click", async () => {  
  const { error } = await supabaseClient.auth.signOut();  
  if (error) showToast(error.message);  
});  
  
supabaseClient.auth.onAuthStateChange((_event, session) => {  
  if (session?.user) enterApp(session.user);  
  else leaveApp();  
});  
  
async function checkSession() {  
  const { data, error } = await supabaseClient.auth.getSession();  
  if (error) authMessage.textContent = error.message;  
  if (data.session?.user) enterApp(data.session.user);  
  else leaveApp();  
}  
function enterApp(user) {  
  authView.classList.add("hidden");  
  appView.classList.remove("hidden");  
  document.getElementById("accountEmail").textContent = user.email || "Signed in";  
  if (!activeChatId) createChat();  
}  
function leaveApp() {  
  appView.classList.add("hidden");  
  authView.classList.remove("hidden");  
  showAuthPanel("welcome");  
  chats = [];  
  activeChatId = null;  
  historyList.innerHTML = "";  
  messages.innerHTML = "";  
}  
function createChat() {  
  const chat = { id: String(Date.now()) + Math.random().toString(16).slice(2), title: "New chat", items: [] };  
  chats.unshift(chat);  
  activeChatId = chat.id;  
  renderHistory();  
  renderMessages();  
  sidebar.classList.remove("open");  
  userInput.focus();  
}  
function currentChat() { return chats.find(chat => chat.id === activeChatId); }  
function renderHistory() {  
  historyList.innerHTML = "";  
  chats.forEach(chat => {  
    const button = document.createElement("button");  
    button.className = "history-item" + (chat.id === activeChatId ? " active" : "");  
    button.textContent = chat.title;  
    button.addEventListener("click", () => {  
      activeChatId = chat.id;  
      renderHistory();  
      renderMessages();  
      sidebar.classList.remove("open");  
    });  
    historyList.appendChild(button);  
  });  
}  
function renderMessages() {  
  const chat = currentChat();  
  messages.innerHTML = "";  
  if (!chat || chat.items.length === 0) {  
    const welcome = document.createElement("div");  
    welcome.className = "welcome-chat";  
    welcome.innerHTML = '<div class="orb">N</div><h1>How can I help you today?</h1><p>Ask NEXORA anything. Your conversation starts here.</p>';  
    messages.appendChild(welcome);  
    return;  
  }  
  chat.items.forEach(item => appendMessageElement(item.role, item.text));  
  messages.scrollTop = messages.scrollHeight;  
}  
function appendMessageElement(role, text) {  
  const row = document.createElement("div");  
  row.className = "message-row " + (role === "user" ? "user" : "assistant");  
  const avatar = document.createElement("div");  
  avatar.className = "avatar";  
  avatar.textContent = role === "user" ? "YOU" : "N";  
  const bubble = document.createElement("div");  
  bubble.className = "bubble";  
  bubble.textContent = text;  
  row.appendChild(avatar);  
  row.appendChild(bubble);  
  messages.appendChild(row);  
  messages.scrollTop = messages.scrollHeight;  
  return bubble;  
}  
function showToast(text) {  
  const toast = document.getElementById("toast");  
  toast.textContent = text;  
  toast.classList.remove("hidden");  
  setTimeout(() => toast.classList.add("hidden"), 3500);  
}  
async function sendMessage() {  
  const userText = userInput.value.trim();  
  if (!userText || sending) return;  
  let chat = currentChat();  
  if (!chat) { createChat(); chat = currentChat(); }  
  chat.items.push({ role: "user", text: userText });  
  if (chat.title === "New chat") {  
    chat.title = userText.slice(0, 32);  
    renderHistory();  
  }  
  appendMessageElement("user", userText);  
  userInput.value = "";  
  resizeInput();  
  const replyBubble = appendMessageElement("assistant", "Thinking...");  
  chat.items.push({ role: "assistant", text: "Thinking..." });  
  const replyIndex = chat.items.length - 1;  
  sending = true;  
  sendBtn.disabled = true;  
  userInput.disabled = true;  
  try {  
    const response = await fetch(WORKER_URL, {  
      method: "POST",  
      headers: { "Content-Type": "application/json" },  
      body: JSON.stringify({ message: userText })  
    });  
    const data = await response.json();  
    if (!response.ok) throw new Error(data.error || "AI connection failed");  
    const answer = data.reply || "I couldn't create a reply.";  
    replyBubble.textContent = answer;  
    chat.items[replyIndex].text = answer;  
  } catch (error) {  
    const errorText = "Connection error: " + error.message;  
    replyBubble.textContent = errorText;  
    chat.items[replyIndex].text = errorText;  
  } finally {  
    sending = false;  
    sendBtn.disabled = false;  
    userInput.disabled = false;  
    userInput.focus();  
    messages.scrollTop = messages.scrollHeight;  
  }  
}  
sendBtn.addEventListener("click", sendMessage);  
userInput.addEventListener("keydown", event => {  
  if (event.key === "Enter" && !event.shiftKey) {  
    event.preventDefault();  
    sendMessage();  
  }  
});  
userInput.addEventListener("input", resizeInput);  
function resizeInput() {  
  userInput.style.height = "auto";  
  userInput.style.height = Math.min(userInput.scrollHeight, 180) + "px";  
}  
document.getElementById("newChat").addEventListener("click", createChat);  
document.getElementById("menuBtn").addEventListener("click", () => sidebar.classList.toggle("open"));  
  
checkSession();  
if ("serviceWorker" in navigator) {  
  window.addEventListener("load", () => {  
    navigator.serviceWorker.register("/service-worker.js")  
      .catch(error => console.log("Service Worker Error:", error));  
  });  
}  
</script>  </body>  
</html>
